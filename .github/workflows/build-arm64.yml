name: Build arm64-v8a APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-arm64-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: 打包 arm64-v8a Release
    # push 时仅当任意 commit message 含「版本更新」才打包；手动触发总是执行（调试用）
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.message, ' '), '版本更新')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept Android SDK licenses
        # runner 预装 SDK 但每次 job 都是新 VM；接受 license 后 AGP 会自动下载缺失组件（platform 37 等）
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls -1d "$SDKROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          echo "using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true

      - name: Restore signing key
        # 可选：有签名 secret 才恢复，否则产出 unsigned APK
        run: |
          if [ -n "$HEADSWAP_SIGNING_B64" ]; then
            mkdir -p ~/.android-keys
            echo "$HEADSWAP_SIGNING_B64" | base64 -d | tar -xz -C ~/.android-keys
            ls -la ~/.android-keys
          else
            echo "未配置 HEADSWAP_SIGNING_B64，将产出 unsigned APK"
          fi
        env:
          HEADSWAP_SIGNING_B64: ${{ secrets.HEADSWAP_SIGNING_B64 }}

      - name: Build release APK (arm64-v8a only)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        working-directory: android
        run: |
          cd app/build/outputs/apk/release
          ls -la
          # 优先签名版 app-release.apk，无签名则 unsigned
          if [ -f app-release.apk ]; then
            cp app-release.apk headswap-arm64-v8a.apk
          elif [ -f app-release-unsigned.apk ]; then
            cp app-release-unsigned.apk headswap-arm64-v8a.apk
          fi
          ls -la headswap-arm64-v8a.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: headswap-arm64-v8a
          path: android/app/build/outputs/apk/release/headswap-arm64-v8a.apk
          if-no-files-found: error

      - name: Create GitHub Release
        # 仅 push 触发（版本更新）时自动发布；手动 dispatch 调试不发 release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: android/app/build/outputs/apk/release
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' ../../../../../build.gradle.kts)
          TAG="v${VERSION_NAME}"
          APK="headswap-${VERSION_NAME}.apk"
          # 与 UpdateLogic.assetUrl 格式一致：releases/download/<tag>/headswap-<version>.apk
          cp headswap-arm64-v8a.apk "$APK"
          echo "version=$VERSION_NAME tag=$TAG apk=$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，删除后重建（--cleanup-tag 会同时删 tag）"
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" "$APK" \
            --title "Headswap ${VERSION_NAME}" \
            --notes "自动构建发布 (arm64-v8a)" \
            --repo "$GITHUB_REPOSITORY"
          echo "release $TAG 已发布"
