name: Build arm64-v8a APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-arm64-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: 打包 arm64-v8a Release
    # push 时仅当任意 commit message 含「版本更新」才打包；手动触发总是执行（调试用）
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.message, ' '), '版本更新')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install SDK 37
        # runner 预装完整 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk），只需补 platform 37
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0"
          sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Restore AA head unit certs (hur/jvc)
        # release 构建硬依赖证书，缺失直接失败；从 secret 注入
        run: |
          if [ -z "$HEADSWAP_AA_CERTS_B64" ]; then
            echo "::error::缺少 HEADSWAP_AA_CERTS_B64 secret（hur/jvc 的 cert.pem/key.pem 打包的 tar.gz base64），release 构建无法继续"
            exit 1
          fi
          mkdir -p "$HEADSWAP_AA_CERTS"
          echo "$HEADSWAP_AA_CERTS_B64" | base64 -d | tar -xz -C "$HEADSWAP_AA_CERTS"
          find "$HEADSWAP_AA_CERTS" -type f
        env:
          HEADSWAP_AA_CERTS: ${{ runner.temp }}/aa-certs
          HEADSWAP_AA_CERTS_B64: ${{ secrets.HEADSWAP_AA_CERTS_B64 }}

      - name: Restore signing key
        # 可选：有签名 secret 才恢复，否则产出 unsigned APK
        run: |
          if [ -n "$HEADSWAP_SIGNING_B64" ]; then
            mkdir -p ~/.android-keys
            echo "$HEADSWAP_SIGNING_B64" | base64 -d | tar -xz -C ~/.android-keys
            ls -la ~/.android-keys
          else
            echo "未配置 HEADSWAP_SIGNING_B64，将产出 unsigned APK"
          fi
        env:
          HEADSWAP_SIGNING_B64: ${{ secrets.HEADSWAP_SIGNING_B64 }}

      - name: Build release APK (arm64-v8a only)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        working-directory: android
        run: |
          cd app/build/outputs/apk/release
          ls -la
          # 优先签名版 app-release.apk，无签名则 unsigned
          if [ -f app-release.apk ]; then
            cp app-release.apk headswap-arm64-v8a.apk
          elif [ -f app-release-unsigned.apk ]; then
            cp app-release-unsigned.apk headswap-arm64-v8a.apk
          fi
          ls -la headswap-arm64-v8a.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: headswap-arm64-v8a
          path: android/app/build/outputs/apk/release/headswap-arm64-v8a.apk
          if-no-files-found: error
